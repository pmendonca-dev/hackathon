[project]
name = "aval"
version = "0.1.0"
description = "AVAL — Pagamento Agêntico com Mandato Verificável"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic",
    "cryptography",
    "fastapi",
    "rfc8785>=0.1.4",
    "sqlalchemy",
    "uvicorn",
]

[project.optional-dependencies]
# The agent runs on rules by default. Install this only to demonstrate a real
# model proposing — and hallucinating — with the core still refusing it, and a
# real model conversing in Telegram until the mandate is fully described.
llm = ["anthropic", "openai"]

[dependency-groups]
dev = [
    "httpx2",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root travels with `src` because eight integration modules import their
# shared harness as `tests.integration.api.conftest`. Without it pytest puts only the
# module's own directory on the path — `tests` is not a package — and those eight fail
# to collect, which aborts the whole run before a single test executes.
pythonpath = ["src", "."]
