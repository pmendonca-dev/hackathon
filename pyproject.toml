[project]
name = "aval"
version = "0.1.0"
description = "AVAL — Pagamento Agêntico com Mandato Verificável"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic",
    "cryptography",
    "fastapi",
    "rfc8785>=0.1.4",
    "sqlalchemy",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
